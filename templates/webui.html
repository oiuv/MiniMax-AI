<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax AI WebUI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --user-bg: #2d4263;
            --ai-bg: #16213e;
            --border: #3a3a5c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h1 {
            font-size: 1.2rem;
            color: var(--accent);
        }
        
        .sidebar-section {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-section h3 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .mode-btn {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .mode-btn:hover { background: var(--accent); }
        .mode-btn.active { background: var(--accent); border-color: var(--accent); }
        
        .sidebar-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        
        .sidebar-section select,
        .sidebar-section input[type="number"],
        .sidebar-section input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .sidebar-section select:focus,
        .sidebar-section input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .new-chat-btn {
            margin: auto 20px 20px;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .new-chat-btn:hover { background: var(--accent-hover); }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h2 { font-size: 1rem; }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }
        
        .message.user { flex-direction: row-reverse; }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar { background: var(--accent); }
        .message.assistant .message-avatar { background: var(--bg-tertiary); border: 1px solid var(--border); }
        
        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        
        .thinking-block {
            background: rgba(233, 69, 96, 0.1);
            border-left: 3px solid var(--accent);
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .thinking-label {
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 5px;
        }
        
        .message-content pre {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .message-content code {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
        }
        
        .chat-input-container {
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            resize: none;
            min-height: 48px;
            max-height: 200px;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .send-btn {
            padding: 12px 24px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .hidden { display: none !important; }
        
        .result-container {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .result-container img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .result-container video,
        .result-container audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .error-message {
            color: var(--accent);
            padding: 10px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 MiniMax AI</h1>
        </div>
        
        <div class="sidebar-section">
            <h3>功能模式</h3>
            <button class="mode-btn active" data-mode="chat">💬 智能对话</button>
            <button class="mode-btn" data-mode="image">🎨 图像生成</button>
            <button class="mode-btn" data-mode="video">🎬 视频生成</button>
            <button class="mode-btn" data-mode="music">🎵 音乐创作</button>
            <button class="mode-btn" data-mode="tts">🔊 语音合成</button>
        </div>
        
        <div class="sidebar-section" id="chat-settings">
            <h3>对话设置</h3>
            <label>模型</label>
            <select id="model-select">
                {% for model in models %}
                <option value="{{ model.id }}">{{ model.name }} - {{ model.desc }}</option>
                {% endfor %}
            </select>
            
            <label>温度 (Temperature)</label>
            <input type="number" id="temperature" value="1.0" min="0" max="2" step="0.1">
            
            <label>最大Token</label>
            <input type="number" id="max-tokens" value="2048" min="100" max="32768" step="100">
            
            <label>系统提示词</label>
            <input type="text" id="system-prompt" placeholder="设定AI角色...">
            
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                <input type="checkbox" id="show-thinking">
                显示思考过程
            </label>
        </div>
        
        <div class="sidebar-section hidden" id="image-settings">
            <h3>图像设置</h3>
            <label>宽高比</label>
            <select id="aspect-ratio">
                <option value="1:1">1:1 正方形</option>
                <option value="16:9">16:9 横屏</option>
                <option value="9:16">9:16 竖屏</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
            </select>
            <label>生成数量</label>
            <input type="number" id="image-count" value="1" min="1" max="9">
        </div>
        
        <div class="sidebar-section hidden" id="tts-settings">
            <h3>语音设置</h3>
            <label>音色</label>
            <select id="voice-select">
                <option value="female-shaonv">女声-少女</option>
                <option value="female-chengshu">女声-成熟</option>
                <option value="male-qn-qingse">男声-青涩</option>
                <option value="male-chengshu">男声-成熟</option>
            </select>
            <label>情感</label>
            <select id="emotion-select">
                <option value="happy">开心</option>
                <option value="sad">悲伤</option>
                <option value="angry">愤怒</option>
                <option value="calm">平静</option>
                <option value="surprised">惊讶</option>
            </select>
            <label>语速</label>
            <input type="number" id="tts-speed" value="1.0" min="0.5" max="2" step="0.1">
        </div>
        
        <button class="new-chat-btn" id="new-chat">🔄 新对话</button>
    </aside>
    
    <main class="main-container">
        <header class="chat-header">
            <h2 id="chat-title">智能对话</h2>
            <span id="model-badge">MiniMax-M2.7</span>
        </header>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message assistant">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    你好！我是 MiniMax AI 助手。有什么可以帮你的吗？
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="user-input" placeholder="输入消息..." rows="1"></textarea>
                <button class="send-btn" id="send-btn">发送</button>
            </div>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const modelBadge = document.getElementById('model-badge');
        const newChatBtn = document.getElementById('new-chat');
        const chatTitle = document.getElementById('chat-title');
        const modeBtns = document.querySelectorAll('.mode-btn');
        
        let sessionId = generateSessionId();
        let currentMode = 'chat';
        let isStreaming = false;
        
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function addMessage(role, content, thinkingContent = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (thinkingContent) {
                const thinkingBlock = document.createElement('div');
                thinkingBlock.className = 'thinking-block';
                thinkingBlock.innerHTML = `<div class="thinking-label">💭 思考过程</div><div class="thinking-text">${escapeHtml(thinkingContent)}</div>`;
                contentDiv.appendChild(thinkingBlock);
            }
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.innerHTML = formatContent(content);
            contentDiv.appendChild(textDiv);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return textDiv;
        }
        
        function addTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typing-message';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            contentDiv.appendChild(typingDiv);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return contentDiv;
        }
        
        function removeTypingIndicator() {
            const typing = document.getElementById('typing-message');
            if (typing) typing.remove();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatContent(content) {
            let formatted = escapeHtml(content);
            formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }
        
        async function sendChatMessage() {
            const message = userInput.value.trim();
            if (!message || isStreaming) return;
            
            const model = modelSelect.value;
            const temperature = parseFloat(document.getElementById('temperature').value);
            const maxTokens = parseInt(document.getElementById('max-tokens').value);
            const systemPrompt = document.getElementById('system-prompt').value;
            const showThinking = document.getElementById('show-thinking').checked;
            
            addMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';
            
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            isStreaming = true;
            sendBtn.disabled = true;
            
            const contentDiv = addTypingIndicator();
            let fullContent = '';
            let thinkingContent = '';
            let textDiv = null;
            
            try {
                const endpoint = showThinking ? '/api/chat/anthropic' : '/api/chat';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        model,
                        temperature,
                        max_tokens: maxTokens,
                        system_prompt: systemPrompt,
                        session_id: sessionId,
                        show_thinking: showThinking,
                        stream: true
                    })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.error) {
                                    contentDiv.innerHTML = `<span class="error-message">错误: ${data.error}</span>`;
                                    break;
                                }
                                
                                if (data.thinking_start) {
                                    contentDiv.innerHTML = '<div class="thinking-block"><div class="thinking-label">💭 思考过程</div><div class="thinking-text"></div></div>';
                                }
                                
                                if (data.thinking) {
                                    thinkingContent += data.thinking;
                                    const thinkingText = contentDiv.querySelector('.thinking-text');
                                    if (thinkingText) thinkingText.textContent = thinkingContent;
                                }
                                
                                if (data.content) {
                                    if (!textDiv) {
                                        textDiv = document.createElement('div');
                                        textDiv.className = 'message-text';
                                        contentDiv.appendChild(textDiv);
                                    }
                                    fullContent += data.content;
                                    textDiv.innerHTML = formatContent(fullContent);
                                }
                                
                                if (data.done) {
                                    sessionId = data.session_id;
                                }
                                
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }
                
                const typingIndicator = contentDiv.querySelector('.typing-indicator');
                if (typingIndicator) typingIndicator.remove();
                
            } catch (error) {
                contentDiv.innerHTML = `<span class="error-message">请求失败: ${error.message}</span>`;
            }
            
            isStreaming = false;
            sendBtn.disabled = false;
        }
        
        async function generateImage() {
            const prompt = userInput.value.trim();
            if (!prompt || isStreaming) return;
            
            addMessage('user', `🎨 生成图像: ${prompt}`);
            userInput.value = '';
            
            isStreaming = true;
            sendBtn.disabled = true;
            
            try {
                const response = await fetch('/api/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        aspect_ratio: document.getElementById('aspect-ratio').value,
                        n: parseInt(document.getElementById('image-count').value)
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addMessage('assistant', `❌ 错误: ${data.error}`);
                } else {
                    let html = '✅ 图像生成成功！<div class="result-container">';
                    if (data.data && data.data.images) {
                        data.data.images.forEach(img => {
                            html += `<img src="${img}" alt="Generated image">`;
                        });
                    }
                    html += '</div>';
                    addMessage('assistant', html);
                }
            } catch (error) {
                addMessage('assistant', `❌ 请求失败: ${error.message}`);
            }
            
            isStreaming = false;
            sendBtn.disabled = false;
        }
        
        async function generateVideo() {
            const prompt = userInput.value.trim();
            if (!prompt || isStreaming) return;
            
            addMessage('user', `🎬 生成视频: ${prompt}`);
            userInput.value = '';
            
            isStreaming = true;
            sendBtn.disabled = true;
            addMessage('assistant', '⏳ 视频生成中，请稍候...');
            
            try {
                const response = await fetch('/api/video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addMessage('assistant', `❌ 错误: ${data.error}`);
                } else {
                    const taskId = data.data?.task_id;
                    if (taskId) {
                        addMessage('assistant', `✅ 视频任务已提交！任务ID: ${taskId}\n\n使用命令查看状态:\npython minimax_cli.py --video-status ${taskId}`);
                    } else {
                        addMessage('assistant', `✅ 视频生成响应: ${JSON.stringify(data.data)}`);
                    }
                }
            } catch (error) {
                addMessage('assistant', `❌ 请求失败: ${error.message}`);
            }
            
            isStreaming = false;
            sendBtn.disabled = false;
        }
        
        async function generateMusic() {
            const prompt = userInput.value.trim();
            if (!prompt || isStreaming) return;
            
            addMessage('user', `🎵 创作音乐: ${prompt}`);
            userInput.value = '';
            
            isStreaming = true;
            sendBtn.disabled = true;
            addMessage('assistant', '⏳ 音乐生成中...');
            
            try {
                const response = await fetch('/api/music', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, lyrics: "" })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addMessage('assistant', `❌ 错误: ${data.error}`);
                } else {
                    addMessage('assistant', `✅ 音乐生成成功！\n\n${JSON.stringify(data.data, null, 2)}`);
                }
            } catch (error) {
                addMessage('assistant', `❌ 请求失败: ${error.message}`);
            }
            
            isStreaming = false;
            sendBtn.disabled = false;
        }
        
        async function generateTTS() {
            const text = userInput.value.trim();
            if (!text || isStreaming) return;
            
            addMessage('user', `🔊 语音合成: ${text}`);
            userInput.value = '';
            
            isStreaming = true;
            sendBtn.disabled = true;
            
            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        voice_id: document.getElementById('voice-select').value,
                        emotion: document.getElementById('emotion-select').value,
                        speed: parseFloat(document.getElementById('tts-speed').value)
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addMessage('assistant', `❌ 错误: ${data.error}`);
                } else {
                    addMessage('assistant', `✅ 语音合成成功！\n\n${JSON.stringify(data.data, null, 2)}`);
                }
            } catch (error) {
                addMessage('assistant', `❌ 请求失败: ${error.message}`);
            }
            
            isStreaming = false;
            sendBtn.disabled = false;
        }
        
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                
                document.getElementById('chat-settings').classList.toggle('hidden', currentMode !== 'chat');
                document.getElementById('image-settings').classList.toggle('hidden', currentMode !== 'image');
                document.getElementById('tts-settings').classList.toggle('hidden', currentMode !== 'tts');
                
                const titles = {
                    chat: '智能对话',
                    image: '图像生成',
                    video: '视频生成',
                    music: '音乐创作',
                    tts: '语音合成'
                };
                chatTitle.textContent = titles[currentMode];
            });
        });
        
        modelSelect.addEventListener('change', () => {
            modelBadge.textContent = modelSelect.value;
        });
        
        newChatBtn.addEventListener('click', () => {
            sessionId = generateSessionId();
            chatMessages.innerHTML = `
                <div class="message assistant">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        新对话已开始。有什么可以帮你的吗？
                    </div>
                </div>
            `;
        });
        
        sendBtn.addEventListener('click', () => {
            switch (currentMode) {
                case 'chat': sendChatMessage(); break;
                case 'image': generateImage(); break;
                case 'video': generateVideo(); break;
                case 'music': generateMusic(); break;
                case 'tts': generateTTS(); break;
            }
        });
        
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
        
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
